    <script>
      function reportErr(info) {
        try {
          fetch('/api/log-error', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(info)
          }).catch(function(){});
        } catch(e) {}
      }
      window.addEventListener('error', function(e) {
        reportErr({
          type: 'error',
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          stack: e.error ? e.error.stack : null
        });
      });
      window.addEventListener('unhandledrejection', function(e) {
        reportErr({
          type: 'unhandledrejection',
          reason: e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'unknown'
        });
      });
    </script>
